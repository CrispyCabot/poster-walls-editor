name: OIDC Debug
# TEMPORARY. Prints the non-secret claims of the GitHub OIDC token so we can
# see exactly what `sub` and `aud` AWS is being asked to match. Delete once the
# deploy role assumption works.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          # Decode the payload only. The signature is never printed.
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64, then pad
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, workflow_ref}'
